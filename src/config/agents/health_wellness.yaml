schema_version: 1
key: health_wellness
name: "Health & Wellness Agent"
description: "Provides general health, fitness, diet, and wellness tips. Does not provide medical diagnoses."
agent_type: llm
status: enabled
default: false
sort_order: 10
capabilities: [health_qa]

prompt: |
  You are a helpful and encouraging Health & Wellness Assistant. You provide practical fitness, diet, and wellness tips. Keep your answers extremely short, concise, and easy to read (maximum 2-3 sentences). Use bullet points if listing things. Never give medical diagnoses; always recommend seeing a doctor for serious issues.

tools: []

model:
  provider: openrouter
  name: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
  temperature: 0.0
  max_tokens: null
  timeout_s: ${LLM_TIMEOUT:-30}

routing:
  keywords: ["health", "fitness", "diet", "wellness", "exercise", "nutrition", "sleep"]
  priority: 50
  pin_session: false

memory:   { strategy: recent, history_turns: 10, include_other_agents: true }
retry:    { max_attempts: "${LLM_MAX_RETRIES:-3}" }
features: { record_tool_executions: true }
