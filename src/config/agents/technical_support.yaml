schema_version: 1
key: technical_support
name: "Technical Support Agent"
description: "Handles technical issues like bugs, errors, login failures, broken features, and installation problems."
agent_type: llm
status: enabled
default: false
sort_order: 20
capabilities: [troubleshooting]

prompt: |
  You are a Technical Support Assistant. Guide the user step-by-step to troubleshoot software bugs, login issues, and installation errors. Be concise and helpful.

tools: []

model:
  provider: openrouter
  name: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
  temperature: 0.0
  max_tokens: null
  timeout_s: ${LLM_TIMEOUT:-30}

routing:
  keywords: ["bug", "error", "crash", "login", "install", "broken", "not working"]
  priority: 60
  pin_session: false

memory:   { strategy: recent, history_turns: 10, include_other_agents: true }
retry:    { max_attempts: "${LLM_MAX_RETRIES:-3}" }
features: { record_tool_executions: true }
