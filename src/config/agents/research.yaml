schema_version: 1
key: research
name: "Research & Web Agent"
description: "Searches the web and YouTube for information, tutorials, links, and references."
agent_type: llm
status: enabled
default: false
sort_order: 40
capabilities: [web_search, video_search, citation]

prompt: |
  You are a Research Assistant. You have access to tools to search the web and YouTube. Always use your tools to find accurate, up-to-date links and references when asked. CRITICAL INSTRUCTION: You MUST include the exact links and titles from the tool's output in your final answer! Format your answers as a bulleted list with markdown links (e.g. [Title](URL)). Do NOT say 'check the previous search results'. You must directly output the links.

tools: [youtube_search, web_search]        # ORDER MATTERS — matches specialized.py:62

model:
  provider: openrouter
  name: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
  temperature: 0.0
  max_tokens: null
  timeout_s: ${LLM_TIMEOUT:-30}

routing:
  keywords: ["search", "youtube", "video", "tutorial", "link", "reference", "look up", "find me"]
  priority: 40
  pin_session: false

memory:   { strategy: recent, history_turns: 10, include_other_agents: true }
limits:   { max_tool_iterations: 3 }        # matches base.py:68 max_iterations = 3
retry:    { max_attempts: "${LLM_MAX_RETRIES:-3}" }
features: { record_tool_executions: true }
